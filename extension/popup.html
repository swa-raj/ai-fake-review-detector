<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 280px;
      font-family: Arial, sans-serif;
      background: #f8f9fa;
    }

    .header {
      background: linear-gradient(135deg, #2c3e50, #3498db);
      color: white;
      padding: 16px;
      text-align: center;
    }

    .header h1 {
      font-size: 15px;
      font-weight: bold;
    }

    .header p {
      font-size: 11px;
      opacity: 0.8;
      margin-top: 4px;
    }

    .content {
      padding: 16px;
    }

    .status {
      background: white;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      font-size: 13px;
      color: #555;
      border: 1px solid #e0e0e0;
      text-align: center;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #2c3e50, #3498db);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .result {
      display: none;
      margin-top: 12px;
      background: white;
      border-radius: 8px;
      padding: 14px;
      border: 1px solid #e0e0e0;
      text-align: center;
    }

    .trust-score {
      font-size: 42px;
      font-weight: bold;
      margin: 8px 0 4px;
    }

    .trust-label {
      font-size: 14px;
      margin-bottom: 12px;
    }

    .stats {
      display: flex;
      justify-content: space-around;
      font-size: 12px;
      color: #555;
      background: #f8f9fa;
      border-radius: 6px;
      padding: 8px;
    }

    .stat { text-align: center; }
    .stat strong { display: block; font-size: 16px; }

    .footer {
      padding: 10px 16px;
      font-size: 10px;
      color: #aaa;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>🔍 Fake Review Detector</h1>
    <p>AI-powered review analyzer</p>
  </div>

  <div class="content">
    <div class="status" id="status">
      Open any product page on Amazon or Flipkart, then click Analyze!
    </div>

    <button class="btn" id="analyzeBtn" >
      🔍 Analyze Reviews
    </button>

    <div class="result" id="result">
      <div style="font-size:13px; color:#777;">Trust Score</div>
      <div class="trust-score" id="trustScore">--</div>
      <div class="trust-label" id="trustLabel">--</div>
      <div class="stats">
        <div class="stat">
          <strong id="totalCount">0</strong>
          Analyzed
        </div>
        <div class="stat">
          <strong id="realCount" style="color:#27ae60;">0</strong>
          Real
        </div>
        <div class="stat">
          <strong id="fakeCount" style="color:#e74c3c;">0</strong>
          Fake
        </div>
      </div>
    </div>
  </div>

  <div class="footer">AI Fake Review Detector v1.0</div>

  <script src="popup.js"></script>
</body>
</html>
